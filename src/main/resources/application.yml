spring:
  application:
    name: bank
  profiles:
    active: default
  datasource:
    url: jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3307}/${DATABASE_NAME:eazybank}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:root}
  jpa:
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:true}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8181/realms/bank-client/protocol/openid-connect/certs}

server:
  port: 8081
  servlet:
    session:
      timeout: 20m

jwt:
  secret:
    value: ${JWT_SECRET_VALUE:jxgEQeXHuPq8VdbyYFNkANdudQ53YUn4}
    defaultValue: ${JWT_SECRET_DEFAULT:jxgEQeXHuPq8VdbyYFNkANdudQ53YUn4}
    expiration: ${JWT_SECRET_EXPIRATION:60000}

app:
  oauth2:
    redirect-uri: ${URL_FE:http://localhost:4200/login}